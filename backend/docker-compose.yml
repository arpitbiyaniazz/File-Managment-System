# ============================================
# Docker Compose — Full Stack Infrastructure
# ============================================
# This file defines ALL services needed to run
# the File Management System locally.
#
# Usage:
#   docker-compose up -d          # Start everything
#   docker-compose up -d postgres redis minio  # Start only infra
#   docker-compose logs -f auth-service        # Follow logs
#   docker-compose down           # Stop everything
#
# WHY Docker Compose?
# - One command starts the entire stack
# - Consistent environment across all developers
# - Services can reference each other by name (DNS)
# - Easy to add/remove services
# ============================================

version: '3.8'

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  # ---- PostgreSQL ----
  # Primary database for all metadata, users, permissions
  # WHY PostgreSQL? ACID compliance, relational integrity,
  # JSON support, excellent for complex queries
  postgres:
    image: postgres:16-alpine
    container_name: fm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: filemanager
      POSTGRES_PASSWORD: filemanager_secret
      POSTGRES_DB: filemanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  # Caching, sessions, rate limiting, pub/sub
  # WHY Redis? Sub-millisecond reads, perfect for
  # caching frequently accessed file metadata
  redis:
    image: redis:7-alpine
    container_name: fm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MinIO (S3-Compatible Object Storage) ----
  # Stores actual file data (documents, images, videos)
  # WHY MinIO? S3-compatible API — migrate to AWS S3 later
  # without changing any code
  minio:
    image: minio/minio:latest
    container_name: fm-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- RabbitMQ (Message Queue) ----
  # Async communication between services
  # WHY RabbitMQ? Simpler than Kafka, great for task queues,
  # supports routing patterns, management UI built-in
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Elasticsearch ----
  # Full-text search and file indexing
  # WHY Elasticsearch? Inverted index for fast text search,
  # fuzzy matching, filtering, aggregations
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: fm-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================
  # API Gateway
  # ============================================

  nginx:
    image: nginx:alpine
    container_name: fm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      search-service:
        condition: service_healthy

  # ============================================
  # Application Services
  # ============================================

  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth-service
    container_name: fm-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - JWT_SECRET=docker-jwt-secret-change-in-production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  file-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: file-service
    container_name: fm-file-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - FILE_SERVICE_PORT=3002
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "3002:3002"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  metadata-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: metadata-service
    container_name: fm-metadata-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - METADATA_SERVICE_PORT=3003
      - POSTGRES_HOST=postgres
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  search-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: search-service
    container_name: fm-search-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SEARCH_SERVICE_PORT=3004
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    ports:
      - "3004:3004"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ============================================
# Persistent Volumes
# ============================================
# Named volumes persist data between docker-compose restarts
# Without volumes, all data is lost when containers stop

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  elasticsearch_data:
