# ============================================
# Nginx API Gateway Configuration
# ============================================
# WHY Nginx as API Gateway?
# - Routes requests to the correct microservice
# - Single entry point for all API calls
# - Handles SSL termination in production
# - Provides rate limiting and load balancing
# - Acts as a reverse proxy — clients never talk to services directly
#
# HOW it works:
#   Client → http://localhost/api/auth/login
#                                     ↓
#   Nginx reads /api/auth/* → proxy to auth-service:3001
#   Nginx reads /api/files/* → proxy to file-service:3002
#   etc.
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # Client body size limit (for file uploads)
    client_max_body_size 100M;

    # ---- Upstream Definitions ----
    # Each upstream points to a backend service
    # In production with multiple instances, you'd list them all here
    # and Nginx would load-balance across them

    upstream auth_service {
        server auth-service:3001;
    }

    upstream file_service {
        server file-service:3002;
    }

    upstream metadata_service {
        server metadata-service:3003;
    }

    upstream search_service {
        server search-service:3004;
    }

    server {
        listen 80;
        server_name localhost;

        # ---- Health Check ----
        location /health {
            return 200 '{"status":"ok","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # ---- Auth Service Routes ----
        location /api/auth/ {
            proxy_pass http://auth_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ---- File Service Routes ----
        location /api/files/ {
            proxy_pass http://file_service/api/files/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # File uploads need larger timeouts
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- Metadata Service Routes ----
        location /api/metadata/ {
            proxy_pass http://metadata_service/api/metadata/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ---- Search Service Routes ----
        location /api/search/ {
            proxy_pass http://search_service/api/search/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ---- Service Health Checks (via gateway) ----
        location /api/auth/health {
            proxy_pass http://auth_service/health;
        }

        location /api/files/health {
            proxy_pass http://file_service/health;
        }

        location /api/metadata/health {
            proxy_pass http://metadata_service/health;
        }

        location /api/search/health {
            proxy_pass http://search_service/health;
        }
    }
}
